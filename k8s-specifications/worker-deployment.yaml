apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: myworker
  name: myworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myworker
  template:
    metadata:
      labels:
        app: myworker
    spec:
      containers:
      - image: dockersamples/examplevotingapp_worker
        name: myworker
